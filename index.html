    <!-- 白画面防止: JSが来る前からローディングを表示 -->
    <style>
      #initial-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
        background: #f5f5f3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .ld-dots { display: flex; gap: 6px; }
      .ld-dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #185FA5;
        animation: ld-anim 1.2s ease-in-out infinite;
      }
      .ld-dot:nth-child(2) { animation-delay: 0.2s; }
      .ld-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes ld-anim {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
        40%            { transform: scale(1.2); opacity: 1;   }
      }
      .ld-label { font-size: 13px; color: #888; letter-spacing: 0.05em; }
    </style>

  <body>
